name: 🚀 Deploy Storefront PROD

on:
  push:
    branches:
      - test-mon-08-dec-25

jobs:
  deploy-prod:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout Code
        uses: actions/checkout@v3

      - name: 🚀 Deploy to PROD VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /root/data/tngd-v3-storefront-prod

            echo "📦 Pull latest changes"
            git fetch origin test-mon-08-dec-25
            git reset --hard origin/test-mon-08-dec-25

            echo "⚙️ Write .env file"
            cat > .env <<EOF
            NEXT_PUBLIC_SALEOR_API_URL=${{ vars.NEXT_PUBLIC_SALEOR_API_URL_PROD }}
            NEXT_PUBLIC_STOREFRONT_URL=${{ vars.NEXT_PUBLIC_STOREFRONT_URL_PROD }}
            EOF

            echo "🧹 Clean old containers & images"
            docker system prune -af

            echo "🐳 Build & start container"
            docker compose -f docker-compose-prod.yml up --build -d

            echo "✅ Storefront deployed successfully!"
